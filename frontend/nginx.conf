# nginx.conf
# Tells Nginx how to serve our static frontend files

server {
    # Listen on port 80 inside the container
    listen 80;

    # The folder where our HTML/CSS/JS files live
    root /usr/share/nginx/html;

    # Default file to serve
    index index.html;

    # For any URL, serve index.html
    # This handles client-side routing (if added later)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
