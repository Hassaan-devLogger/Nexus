services:

  db:
    image: postgres:15-alpine
    container_name: nexus_db
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_pass
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexus_network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: nexus_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nexus
      DB_USER: nexus_user
      DB_PASSWORD: nexus_pass
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - nexus_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: nexus_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - nexus_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  nexus_network:
    driver: bridge
